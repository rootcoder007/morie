version: 2
updates:
  # GitHub Actions used across the CI DAG (build.yml + child workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 5
    # Group all github-actions bumps into ONE weekly PR instead of N,
    # to avoid the per-action PR spam.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # Python dependencies declared in pyproject.toml. This is the package's
  # actual runtime dependency surface (numpy/scipy/pandas/httpx/...), so
  # security updates here matter most. NOTE: requirements-lock.txt is a
  # uv --generate-hashes lock regenerated by the maintainer, not by
  # Dependabot; treat lock refresh as a separate step.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(pip)"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dockerfile base image -- otherwise unwatched.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
