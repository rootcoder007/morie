name: R CMD check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Parallel compile for source-installed dependencies (notably duckdb,
  # which has ~50 MB of C++ source and otherwise takes 20-25 min single-
  # threaded). GitHub-hosted runners are 4-vCPU / 16 GB RAM so -j4 fits.
  MAKEFLAGS: "-j4"


# Run R CMD check across the supported OS x R-version matrix. Required
# for CRAN submission readiness; also feeds the r-universe daily build.
#
# The R package source lives at r-package/morie (alongside the
# Python src/ tree at the repo root); the matrix sets the
# working-directory accordingly.

# Triggered only via the build.yml orchestrator (workflow_call).
# Kept workflow_dispatch so this can still be run manually for
# debugging.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # r-devel is a moving target (informational, mirrors rmorie's policy):
    # its cell may fail without failing the workflow.
    continue-on-error: ${{ matrix.config.allow_failure || false }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest,   r: '4.6.1' }
          # Use windows-latest so the runner image tracks GitHub's most-
          # recently-patched Windows image (currently windows-2022, moving
          # to windows-2025-vs2026 by 2026-06-15). Pinning to a specific
          # release sticks us on an older image once `latest` rolls.
          - { os: windows-latest, r: '4.6.1' }
          - { os: ubuntu-latest,  r: '4.6.1' }
          - { os: ubuntu-latest,  r: 'devel', allow_failure: true }
          - { os: ubuntu-latest,  r: 'oldrel-1' }

    env:
      # R-devel has no binary packages, so that cell compiles the whole
      # dependency tree from source. At the workflow-wide -j4 the runner was
      # starved and lost contact with the server ("The hosted runner lost
      # communication with the server"), which shows as a red check even
      # though the cell is allow_failure. Two jobs keeps the peak inside the
      # 16 GB runner; every other cell keeps -j4.
      MAKEFLAGS: ${{ matrix.config.r == 'devel' && '-j2' || '-j4' }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
      # CRAN requires \donttest (not \dontrun) for examples a user could
      # run, so the network-fetching examples are \donttest -- and
      # --as-cran executes those. On a GitHub runner they crawl against
      # throttled services until the job times out, which is what killed
      # the Debian leg for weeks. CRAN's own machines decide for
      # themselves; ours skip them, and the full example sweep runs on
      # L14 instead.
      _R_CHECK_DONTTEST_EXAMPLES_: false

    defaults:
      run:
        working-directory: r-package/morie

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # rmoriebricklayer compiles rmbl_fetch.cpp against libcurl. When its
      # r-universe binary isn't available for this R/platform it falls back to
      # a source build, which needs curl/curl.h -- install it (Linux) before
      # the manual install below, which runs BEFORE setup-r-dependencies.
      - name: System libs for rmoriebricklayer source build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev

      # cache-version: 1 -- pak's binary cache persists across runs.
      # Bump to invalidate on toolchain change.
      - name: Pre-install rmoriebricklayer (transitive via rmoriedata; r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      # A single failed source download wedges pak: pkgdepends stops in
      # select_next_task() with "Cannot select new package installation
      # task" instead of retrying, and the job dies before the package is
      # even built. This is what took the macOS leg down on 130df3c5. One
      # clean second attempt (warm cache, so it is cheap) clears it.
      # CRAN now ships macOS binaries zstd-compressed (R 4.6 NEWS: "binary
      # packages can have the extensions .tar.bz2, .tar.xz, .tar.zst and
      # .tar.zstd"). pak's installer only unpacks gzip, so on macOS every
      # dependency install dies with "Cannot extract ... unknown archive
      # type" -- seen on bayestestR and Boom, and neither a cache purge nor a
      # per-package source override fixes it, because the whole tree is zstd.
      # Base R reads these archives natively, so macOS installs dependencies
      # with base R and leaves pak to the platforms where it works.
      - id: deps
        if: runner.os != 'macOS'
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: r-package/morie
          cache-version: 2
          # knitr is the declared VignetteBuilder and rmarkdown renders the
          # vignettes; both live in Suggests, so the hard-only install on devel
          # left R CMD build with "vignette builder 'knitr' not found". Name them
          # explicitly so they are present whatever the dependency scope.
          extra-packages: any::rcmdcheck any::knitr any::rmarkdown github::stan-dev/cmdstanr
          # R-devel has no binaries, so every dependency is built from source
          # there. Installing all 133 Suggests that way took the cell to 182
          # minutes and then starved the runner, while every other cell -- which
          # gets binaries -- finishes inside the hour. On devel, install hard
          # dependencies only: _R_CHECK_FORCE_SUGGESTS_ is already false, so the
          # check skips the Suggests-dependent tests instead of erroring, and the
          # cell still does its real job of proving the package configures,
          # compiles and checks under R-devel.
          dependencies: ${{ matrix.config.r == 'devel' && '"hard"' || '"all"' }}
          needs: ${{ matrix.config.r == 'devel' && '' || 'check' }}

      - name: Install dependencies with base R (macOS, zstd-capable)
        if: runner.os == 'macOS'
        working-directory: r-package/morie
        shell: Rscript {0}
        env:
          # DESCRIPTION carries GitHub Remotes:, so install_deps queries
          # api.github.com. Without an explicit token remotes picks up the
          # credential actions/checkout stores for git, which the REST API
          # rejects with "HTTP error 401. Bad credentials".
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          # r-universe carries binaries for the two sibling packages, so take
          # them from there rather than building the GitHub sources.
          install.packages(c("rmoriebricklayer", "rmoriedata"),
                           repos = c("https://rootcoder007.r-universe.dev",
                                     "https://cloud.r-project.org"))
          # cmdstanr is not on CRAN; Suggests declares it, so provide it.
          install.packages("cmdstanr",
                           repos = c("https://stan-dev.r-universe.dev",
                                     "https://cloud.r-project.org"))
          remotes::install_deps(dependencies = TRUE, upgrade = "never")

      # The observed failure was a corrupt binary, not a missing one:
      #   Cannot extract '.../bayestestR_0.19.0.tgz', unknown archive type
      # pak keeps that file, so a bare retry re-reads the same bad archive.
      # Drop the caches and take a fresh cache key before trying again.
      - name: Clear poisoned pak cache
        if: runner.os != 'macOS' && steps.deps.outcome == 'failure'
        shell: bash
        run: |
          R -q -e 'try(pak::cache_clean(), silent = TRUE); try(pkgcache::pkg_cache_delete_files(), silent = TRUE)' || true
          rm -rf ~/Library/Caches/org.R-project.R/R/pkgcache \
                 ~/.cache/R/pkgcache ~/.cache/R/pak \
                 "${RUNNER_TEMP}/pkgcache" 2>/dev/null || true

      - if: runner.os != 'macOS' && steps.deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: r-package/morie
          cache-version: 3
          # knitr is the declared VignetteBuilder and rmarkdown renders the
          # vignettes; both live in Suggests, so the hard-only install on devel
          # left R CMD build with "vignette builder 'knitr' not found". Name them
          # explicitly so they are present whatever the dependency scope.
          extra-packages: any::rcmdcheck any::knitr any::rmarkdown github::stan-dev/cmdstanr
          dependencies: ${{ matrix.config.r == 'devel' && '"hard"' || '"all"' }}
          needs: ${{ matrix.config.r == 'devel' && '' || 'check' }}

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: r-package/morie
          upload-snapshots: true
          # Drop --as-cran (too strict pre-CRAN; we'll re-enable for the
          # CRAN-submission PR). Keep --no-manual since we don't ship
          # vignettes/PDFs in CI.
          #
          # The devel cell is scoped differently on purpose. R-devel ships no
          # binaries, so installing all 133 Suggests there means building them
          # from source: that is what took the cell to 182 minutes and starved
          # the runner. With hard dependencies only it finishes in minutes, but
          # examples and tests then fail for a reason that says nothing about
          # R-devel -- an example touching an optional backend stops with
          # "morie requires package 'DBI'", and tests cannot library(testthat).
          # So on devel the cell checks what it is actually for: that the
          # package configures, compiles, installs and its Rd parse under the
          # next R. Examples, tests and vignettes are exercised in full on the
          # other four cells, which get binaries and the complete Suggests set.
          args: ${{ matrix.config.r == 'devel' && 'c("--no-manual", "--no-examples", "--no-tests", "--no-vignettes")' || 'c("--no-manual")' }}
          build_args: ${{ matrix.config.r == 'devel' && 'c("--no-manual", "--no-build-vignettes")' || '"--no-manual"' }}
          error-on: '"error"'

      # Post-check QA (lintr / covr / goodpractice) was folded INTO this
      # cell in 3MMM.65 to "share R library state" -- the actual effect
      # was +40 min of sequential duplicate work (covr re-runs all tests
      # instrumented; goodpractice re-runs R CMD check internally).
      # Reverted in 3MMM.72: lintr + covr now run as separate parallel
      # jobs in r-coverage-and-lint.yml. goodpractice + pkgcheck dropped
      # from regular CI -- only workflow_dispatch (manually run before
      # rOpenSci submission).

  # Separate Linux-only job that spins up a live PostgreSQL service and
  # exercises the PG branch of the DBI cache layer. The PG testthat
  # block in tests/testthat/test-db-backends.R is gated on
  # MORIE_PG_TEST=true; this job sets that env var so the tests run.
  # The default R-CMD-check matrix above does NOT set MORIE_PG_TEST,
  # so the PG block correctly skips there.
  R-CMD-check-postgres:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release) + postgres-15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # R-devel has no binary packages, so that cell compiles the whole
      # dependency tree from source. At the workflow-wide -j4 the runner was
      # starved and lost contact with the server ("The hosted runner lost
      # communication with the server"), which shows as a red check even
      # though the cell is allow_failure. Two jobs keeps the peak inside the
      # 16 GB runner; every other cell keeps -j4.
      MAKEFLAGS: ${{ matrix.config.r == 'devel' && '-j2' || '-j4' }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
      # CRAN requires \donttest (not \dontrun) for examples a user could
      # run, so the network-fetching examples are \donttest -- and
      # --as-cran executes those. On a GitHub runner they crawl against
      # throttled services until the job times out, which is what killed
      # the Debian leg for weeks. CRAN's own machines decide for
      # themselves; ours skip them, and the full example sweep runs on
      # L14 instead.
      _R_CHECK_DONTTEST_EXAMPLES_: false
      MORIE_PG_TEST: "true"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: testdb

    defaults:
      run:
        working-directory: r-package/morie

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: System libs for rmoriebricklayer source build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev

      - name: Pre-install rmoriebricklayer (transitive via rmoriedata; r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - id: deps_pg
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: r-package/morie
          cache-version: 2
          extra-packages: |
            any::rcmdcheck
            github::stan-dev/cmdstanr
            any::RPostgres
            any::duckdb
            any::withr
          needs: check

      - name: Clear poisoned pak cache
        if: steps.deps_pg.outcome == 'failure'
        shell: bash
        run: |
          R -q -e 'try(pak::cache_clean(), silent = TRUE); try(pkgcache::pkg_cache_delete_files(), silent = TRUE)' || true
          rm -rf ~/Library/Caches/org.R-project.R/R/pkgcache \
                 ~/.cache/R/pkgcache ~/.cache/R/pak \
                 "${RUNNER_TEMP}/pkgcache" 2>/dev/null || true

      - if: steps.deps_pg.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: r-package/morie
          cache-version: 3
          extra-packages: |
            any::rcmdcheck
            github::stan-dev/cmdstanr
            any::RPostgres
            any::duckdb
            any::withr
          needs: check

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: r-package/morie
          upload-snapshots: true
          args: 'c("--no-manual")'
          error-on: '"error"'
