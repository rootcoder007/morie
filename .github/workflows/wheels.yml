name: Build wheels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Verifies the compiled morie wheel (the libmorie / morie._core C++
# core) builds across Linux, macOS, and Windows via cibuildwheel.
# Path-restricted to the C++ / packaging surface -- pure-Python changes
# are covered by ci.yml, so they do not trigger a 12-wheel matrix.

# Triggered only via the build.yml orchestrator (workflow_call).
# Kept workflow_dispatch so this can still be run manually for
# debugging.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Build wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
