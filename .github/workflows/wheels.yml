name: Build wheels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Verifies the compiled morie wheel (the libmorie / morie._core C++
# core) builds across Linux, macOS, and Windows via cibuildwheel.
# Path-restricted to the C++ / packaging surface -- pure-Python changes
# are covered by ci.yml, so they do not trigger a 12-wheel matrix.

# Triggered only via the build.yml orchestrator (workflow_call).
# Kept workflow_dispatch so this can still be run manually for
# debugging.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
