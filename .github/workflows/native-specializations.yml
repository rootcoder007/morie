# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Branch gate for feat/native-specializations: every push must pass
# R CMD check --as-cran in the hard-deps flavour (the whole point of
# the branch is zero-Suggests engines) plus the three native test
# tiers. Debian bookworm container: P3M binaries keep it fast.
name: native-specializations

on:
  push:
    branches: [feat/native-specializations]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  as-cran-hard-deps:
    runs-on: ubuntu-latest
    container: r-base:4.5.1
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Static guards (fail fast before the 20-minute check)
        run: Rscript scripts/audit/check_r_undefined.R r-package/morie
      - name: System libraries + toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq build-essential libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install hard dependencies + tooling
        run: |
          options(HTTPUserAgent = sprintf(
            "R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"],
                  R.version["arch"], R.version["os"])))
          repos <- c(
            runiverse = "https://rootcoder007.r-universe.dev",
            P3M = "https://packagemanager.posit.co/cran/__linux__/bookworm/latest",
            CRAN = "https://cloud.r-project.org")
          # rmoriedata is in DESCRIPTION Imports (a HARD dependency), so
          # pkgload::load_all() cannot build the package without it. It was
          # missing from this list, and the job failed with
          #   ERROR: dependency 'rmoriedata' is not available for package 'morie'
          # It is published on the r-universe repo already listed above.
          pkgs <- c("here", "Rcpp", "RcppArmadillo",
                    "rmoriedata", "rmoriebricklayer",
                    "testthat", "pkgload", "rcmdcheck")
          install.packages(pkgs, repos = repos, Ncpus = 2)
          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing) > 0) stop("failed to install: ",
                                        paste(missing, collapse = ", "))
        shell: Rscript {0}
      - name: Native test tiers (structural + cross + property)
        run: |
          pkgload::load_all("r-package/morie", quiet = TRUE)
          bad <- 0L
          for (f in c(Sys.glob("r-package/morie/tests/testthat/test-matching-native.R"),
                      Sys.glob("r-package/morie/tests/cross/*.R"),
                      Sys.glob("r-package/morie/tests/property/*.R"))) {
            d <- as.data.frame(testthat::test_file(f, reporter = "summary"))
            bad <- bad + sum(d$failed) + sum(d$error)
          }
          if (bad > 0) stop(bad, " native-tier failures")
        shell: Rscript {0}
      # --no-tests until task #96 (bare-install test hygiene, the
      # skip_if_not_installed sweep rmorie already had) lands: the wider
      # suite fails 111 tests without Suggests, which is main's debt, not
      # this branch's. The native tiers above ARE this branch's tests.
      - name: R CMD check (as-cran, no vignettes)
        run: |
          res <- rcmdcheck::rcmdcheck(path = "r-package/morie",
            args = c("--no-manual", "--as-cran", "--ignore-vignettes",
                     "--no-tests"),
            build_args = c("--no-build-vignettes", "--no-manual"),
            error_on = "error")
          print(res)
        shell: Rscript {0}
      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-spec-check-logs
          path: |
            check/*.Rcheck/00check.log
            check/*.Rcheck/tests/
          if-no-files-found: ignore
          retention-days: 7
