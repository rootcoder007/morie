name: numba bench (opt-in JIT speedup)

# Compare timings of morie.fast kernels with and without the [fast]
# extra installed.  Runs nightly + on workflow_dispatch.  Does NOT
# replace the main CI — JIT is opt-in.

on:
  schedule:
    - cron: "37 4 * * *"   # nightly at 04:37 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numba wheels max out at Python 3.14
        python-version: ["3.12"]
        extras:
          - ""        # base install — no numba; tests the fallback path
          - "fast"    # with numba — tests the JIT path
    name: bench py${{ matrix.python-version }} (${{ matrix.extras || 'base' }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install morie
        run: |
          pip install --upgrade pip setuptools wheel
          if [ -n "${{ matrix.extras }}" ]; then
            pip install --prefer-binary -e ".[${{ matrix.extras }},test]"
          else
            pip install --prefer-binary -e ".[test]"
          fi

      - name: Sanity — is JIT available?
        run: |
          python -c "import morie.fast as mf; print('jit_available:', mf.is_jit_available())"

      - name: Bench — normal_pdf vs the numpy closed form
        run: |
          python -c "
          import time, math, numpy as np
          import morie.fast as mf

          # Reference: the Gaussian density written out.  morie implements
          # these kernels natively, so the baseline is the formula itself
          # rather than another library.
          def ref_normal_pdf(x, mu, sigma):
              z = (x - mu) / sigma
              return np.exp(-0.5 * z * z) / (sigma * math.sqrt(2.0 * math.pi))

          # Warm up the JIT cache (first call compiles)
          mf.normal_pdf(np.array([0.0]), 0.0, 1.0)

          x = np.random.default_rng(0).normal(size=200_000)
          t0 = time.perf_counter()
          for _ in range(50):
              ref_normal_pdf(x, 0.0, 1.0)
          t_np = (time.perf_counter() - t0) / 50

          t0 = time.perf_counter()
          for _ in range(50):
              mf.normal_pdf(x, 0.0, 1.0)
          t_mf = (time.perf_counter() - t0) / 50

          print(f'numpy closed form    : {t_np*1000:.3f} ms / call')
          print(f'morie.fast.normal_pdf: {t_mf*1000:.3f} ms / call')
          print(f'speedup              : {t_np/t_mf:.2f}x  (>1 = morie.fast is faster)')
          print(f'jit_available        : {mf.is_jit_available()}')
          "

      - name: Bench — pearson r vs numpy corrcoef
        run: |
          python -c "
          import time, numpy as np
          import morie.fast as mf

          mf.cor_pearson_jit(np.array([1.0, 2.0]), np.array([2.0, 4.0]))
          rng = np.random.default_rng(0)
          x = rng.normal(size=200_000)
          y = x * 0.8 + rng.normal(size=200_000) * 0.5

          t0 = time.perf_counter()
          for _ in range(50):
              np.corrcoef(x, y)[0, 1]
          t_np = (time.perf_counter() - t0) / 50

          t0 = time.perf_counter()
          for _ in range(50):
              mf.cor_pearson_jit(x, y)
          t_mf = (time.perf_counter() - t0) / 50

          print(f'numpy.corrcoef        : {t_np*1000:.3f} ms / call')
          print(f'morie.fast.cor_pearson: {t_mf*1000:.3f} ms / call')
          print(f'speedup               : {t_np/t_mf:.2f}x')
          print(f'jit_available         : {mf.is_jit_available()}')
          "

      - name: Correctness — both code paths must agree
        run: |
          python -c "
          import math
          import numpy as np
          import morie.fast as mf

          def ref_normal_pdf(x, mu, sigma):
              z = (x - mu) / sigma
              return np.exp(-0.5 * z * z) / (sigma * math.sqrt(2.0 * math.pi))

          x = np.random.default_rng(0).normal(size=10_000)
          assert abs(mf.normal_pdf(x, 0.0, 1.0) - ref_normal_pdf(x, 0.0, 1.0)).max() < 1e-10, 'normal_pdf disagreement'
          y = x * 0.8 + np.random.default_rng(1).normal(size=10_000) * 0.5
          assert abs(mf.cor_pearson_jit(x, y) - np.corrcoef(x, y)[0, 1]) < 1e-10, 'pearson disagreement'
          assert abs(mf.mean_jit(x) - x.mean()) < 1e-10, 'mean disagreement'
          assert abs(mf.std_jit(x, 1) - x.std(ddof=1)) < 1e-10, 'std disagreement'

          # The reference must be able to fail: perturb one input and the
          # normal_pdf assertion above has to reject it.
          bad = ref_normal_pdf(x, 0.01, 1.0)
          assert abs(mf.normal_pdf(x, 0.0, 1.0) - bad).max() > 1e-10, 'reference cannot fail'
          print('all correctness checks passed')
          "
