name: Publish to PyPI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


# Publishes the morie Python package to PyPI on every tag of the
# form v*.*.* (e.g., v0.1.1, v0.2.0). Uses Trusted Publisher OIDC —
# no API token in GitHub secrets. The PyPI side has a Trusted
# Publisher configured at:
#   https://pypi.org/manage/project/morie/settings/publishing/
# with: Owner=rootcoder007 Repository=morie Workflow=pypi-publish.yml
# Environment=pypi.
#
# Since v0.9.1 morie ships a compiled C++ core (morie._core), so the
# release carries platform wheels: the sdist is built once and the
# wheels are built per-OS by cibuildwheel (config in pyproject.toml's
# [tool.cibuildwheel]). publish-to-pypi merges every artifact and
# uploads them together.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir dist/
          python -m twine check dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Build wheels
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  test:
    name: Test built wheel
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download Linux wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-wheels-ubuntu-latest
          path: wheelhouse

      - name: Install the built wheel and test
        run: |
          python -m pip install --upgrade pip pytest
          # The artifact may extract into a nested dir; locate the wheels
          # and pin to the built version so pip can NEVER silently fall
          # back to the older release on PyPI (which is what happened to
          # the v1.0.0 gate: it tested PyPI's 0.9.9, not the built wheel).
          v=$(awk -F'"' '/^version *=/{print $2; exit}' pyproject.toml)
          dir=$(dirname "$(find wheelhouse -name '*.whl' -print -quit)")
          python -m pip install --find-links "$dir" "morie[test]==$v"
          python -c "import morie; assert morie.__version__ == '$v', morie.__version__"
          # Run against the installed package, not the source tree.
          python -m pytest tests/ -q -p no:cacheprovider

  publish-to-pypi:
    name: Publish to PyPI
    needs: [sdist, wheels, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/morie/
    permissions:
      id-token: write
    steps:
      - name: Download all distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          skip-existing: true
          # PEP 740 attestations — generates Sigstore signatures for the
          # uploaded artifacts and lets PyPI verify the project URLs
          # (Homepage / Repository / Issues / Documentation / Changelog),
          # which removes the "Unverified details" banner on the project
          # page once the upload is processed.
          attestations: true
