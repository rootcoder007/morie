# Nightly rotating sample of the 36k auto-generated tests/fn suite.
#
# The full generated suite costs ~30 CPU-hours (~3 s/file: each test fits
# real models on random arrays), so nothing ever ran it — which made it
# false assurance. This job runs a date-seeded 500-file sample (~25 min);
# the seed rotates daily, so over ~10 weeks every file gets exercised.
# A failure here means a real regression in morie.fn or in the generator.
name: fn-sampled

on:
  schedule:
    - cron: "23 5 * * *" # nightly at 05:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary --only-binary=numpy,plotly -e ".[test]" pytest-timeout
      # The suite's own FALSE-POSITIVE RISK warning fires on 3,621 tests whose
      # assertions cannot fail. Warnings do not fail a build, so nothing read
      # it. tests/fn/_audit/trivial_tests.csv is the committed register of
      # those tests; this step fails if the count grows, so new trivial tests
      # cannot be added silently. Lowering the baseline is a normal commit.
      - name: Trivial-assertion baseline must not grow
        run: python tests/fn/_audit/harvest_trivial.py --check

      - name: Run date-seeded 500-file sample
        run: |
          SEED=$(date -u +%Y%m%d)
          echo "sample seed: ${SEED}"
          find tests/fn -name 'test_*.py' | sort | \
            shuf --random-source=<(yes "${SEED}") -n 500 > /tmp/fn_sample.txt
          wc -l /tmp/fn_sample.txt
          # addopts in pyproject ignores tests/fn; override for this job.
          xargs -a /tmp/fn_sample.txt python -m pytest -q -o addopts="" \
            -p no:cacheprovider --timeout=120
        env:
          MORIE_NO_UPDATE_CHECK: "1"
