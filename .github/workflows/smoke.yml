# Clean-user smoke: install the built wheel into an empty HOME on three OSes and run every
# `morie` verb for real (scripts/smoke/smoke.py), plus the docs drift check. A tag is only
# cut when this and `build` are green on the same commit.
name: smoke
# a newer push to the same ref cancels the run this one supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and install the wheel into a fresh venv
        shell: bash
        run: |
          python -m pip install -q --upgrade pip build
          python -m build --wheel --outdir dist >/dev/null
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then P="$RUNNER_TEMP/venv/bin/python"; else P="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          "$P" -m pip install -q dist/*.whl
          echo "SMOKE_PY=$P" >> "$GITHUB_ENV"
      - name: cache the downloaded datasets between runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/smoke-cache
          key: morie-smoke-datasets-${{ runner.os }}-v1
      - name: smoke
        shell: bash
        env:
          MORIE_SMOKE_KEY: ${{ secrets.MORIE_SMOKE_KEY }}
          MORIE_SMOKE_CACHE: ${{ runner.temp }}/smoke-cache
        run: '"$SMOKE_PY" scripts/smoke/smoke.py'
      - name: docs drift
        shell: bash
        run: '"$SMOKE_PY" scripts/smoke/docs_verbs.py docs/source README.md WHATS_NEW.md'
  r-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev
      - id: deps
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package/morie
          dependencies: '"hard"'
          extra-packages: any::pkgload any::testthat any::withr any::httr2 any::jsonlite any::DBI any::RSQLite any::duckdb any::xml2 any::readxl
      - name: install dependencies with base R (when pak cannot solve)
        if: steps.deps.outcome == 'failure'
        shell: Rscript {0}
        run: |
          repos <- c("https://rootcoder007.r-universe.dev", "https://stan-dev.r-universe.dev", "https://cloud.r-project.org")
          install.packages(c("remotes", "pkgload", "testthat", "withr", "httr2", "jsonlite", "DBI", "RSQLite", "duckdb", "xml2", "readxl"), repos = repos)
          remotes::install_deps("r-package/morie", dependencies = NA, repos = repos, upgrade = "never")
      - name: install the R arm
        shell: bash
        run: R CMD INSTALL r-package/morie
      - name: smoke (morie R arm)
        env:
          MORIE_SMOKE_KEY: ${{ secrets.MORIE_SMOKE_KEY }}
          MORIE_SMOKE_PKG: morie
        run: Rscript r-package/morie/inst/smoke/smoke.R
