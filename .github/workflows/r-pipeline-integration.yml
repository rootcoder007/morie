# SPDX-License-Identifier: AGPL-3.0-or-later
#
# r-pipeline-integration.yml -- end-to-end reproducibility gate.
#
# Installs the Python package AND the R `morie` package, then runs
# `morie pipeline --all` on the committable CPADS fixture that rmoriedata
# ships (inst/extdata/cpads_pumf_synthetic.csv), and asserts ALL 23 pipeline
# modules complete -- including the 5 R-backed stages (figures, tables,
# final-report, otis-analysis, mapq-psychometrics) that run through the
# Python->R bridge. This is the guard that keeps the R modules runnable from
# a clean install (the bridge regression that shipped in 1.0.1).
#
# NOTE: the pipeline catches per-module errors and still exits 0 (printing
# "ERROR in <module>"), so the assertion below checks for those lines and
# that the completed count equals len(MODULE_SPECS) -- not just the exit code.
name: r-pipeline-integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-23-of-23:
    name: pipeline --all (23/23, Python + R)
    runs-on: ubuntu-latest
    env:
      MORIE_NO_EXEC: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      # rmoriebricklayer is a transitive dep of the R morie package; install it
      # from r-universe first (mirrors r-cmd-check.yml). Its r-universe binary
      # may be unavailable for this R/platform, forcing a source build of
      # rmbl_fetch.cpp against libcurl -- install curl/curl.h first.
      - name: System libs for rmoriebricklayer source build
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - name: Pre-install rmoriebricklayer (r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r-package/morie
          cache-version: 2
          needs: check

      - name: Install the R morie package (provides morie_run_morie_modules)
        run: R CMD INSTALL --no-multiarch --no-docs r-package/morie

      # rmoriedata ships the committable, schema-complete CPADS fixture the
      # pipeline runs on (inst/extdata/cpads_pumf_synthetic.csv). Pull it from
      # r-universe so this job stays self-contained.
      - name: Install rmoriedata (ships the CPADS fixture)
        run: install.packages("rmoriedata", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}

      - name: Install morie (Python, builds the C++ core)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -e ".[test,interactive]"

      - name: Run pipeline --all on the rmoriedata CPADS fixture, assert 23/23
        run: |
          set -o pipefail
          FIXTURE="$(Rscript -e 'cat(system.file("extdata", "cpads_pumf_synthetic.csv", package = "rmoriedata"))')"
          echo "fixture: $FIXTURE"
          test -s "$FIXTURE" || { echo "::error::rmoriedata CPADS fixture not found"; exit 1; }
          morie pipeline --all --cpads-csv "$FIXTURE" --output-dir out -y --no-carbon 2>&1 | tee pipe.log || true
          TOTAL="$(python -c 'from morie.modules import MODULE_SPECS; print(len(MODULE_SPECS))')"
          if grep -q "ERROR in " pipe.log; then
            echo "::error::pipeline modules errored:"; grep "ERROR in " pipe.log
            exit 1
          fi
          COMPLETED="$(sed -n 's/^Completed modules: //p' pipe.log | tr ',' '\n' | grep -c '[a-z]')"
          echo "completed=$COMPLETED total=$TOTAL"
          if [ "$COMPLETED" -ne "$TOTAL" ]; then
            echo "::error::only $COMPLETED/$TOTAL pipeline modules completed"
            exit 1
          fi
          echo "All $TOTAL/$TOTAL pipeline modules completed (incl. the 5 R-backed stages)."

      # The path a fresh `pip install morie` user hits: no --cpads-csv, the
      # bundled src/morie/data/cpads_synthetic.csv. Guards the out-of-the-box
      # 23/23 promise (this fixture was miscoded until 2026-07-10 and shipped
      # an 18/23 first-run experience without CI noticing).
      - name: Run pipeline --all on the BUNDLED fixture (out-of-the-box path), assert 23/23
        run: |
          set -o pipefail
          morie pipeline --all --output-dir out-bundled -y --no-carbon 2>&1 | tee pipe-bundled.log || true
          TOTAL="$(python -c 'from morie.modules import MODULE_SPECS; print(len(MODULE_SPECS))')"
          if grep -q "ERROR in " pipe-bundled.log; then
            echo "::error::bundled-fixture pipeline modules errored:"; grep "ERROR in " pipe-bundled.log
            exit 1
          fi
          COMPLETED="$(sed -n 's/^Completed modules: //p' pipe-bundled.log | tr ',' '\n' | grep -c '[a-z]')"
          echo "completed=$COMPLETED total=$TOTAL"
          if [ "$COMPLETED" -ne "$TOTAL" ]; then
            echo "::error::only $COMPLETED/$TOTAL modules completed on the bundled fixture"
            exit 1
          fi
          echo "Out-of-the-box path green: $TOTAL/$TOTAL on the bundled synthetic fixture."
