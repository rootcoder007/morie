name: R coverage + lint

# Two small parallel jobs: covr (coverage) + lintr (style).
# Both run in parallel with r-cmd-check matrix, NOT serialized after it.
# Avoids the +40 min sequential cost from 3MMM.65 (reverted in 3MMM.72).
#
# pkgcheck + goodpractice were dropped from automatic CI in 3MMM.72:
#   * Both re-run R CMD check + covr + cyclocomp + lintr internally,
#     duplicating work already done in this DAG. ~1 hour per push each.
#   * They remain available via workflow_dispatch for pre-rOpenSci-
#     submission audits -- just not on every push.

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MAKEFLAGS: "-j4"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: covr + codecov upload

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
      # pak resolves Remotes against the GitHub API; without a token
      # anonymous lookups can 404 or hit rate limits, surfacing as
      # "Can't find GitHub repo rootcoder007/rmoriedata". Pass the
      # runner token so pak authenticates.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: r-package/morie

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Pre-install rmoriebricklayer (transitive via rmoriedata; r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r-package/morie
          cache-version: 2
          extra-packages: any::covr any::xml2
          needs: coverage

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - name: Run covr
        run: |
          Rscript -e 'cov <- covr::package_coverage(type = "tests", quiet = TRUE); covr::to_cobertura(cov, filename = "coverage.xml"); cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cov)))'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: r-package/morie/coverage.xml
          flags: r-tests
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    name: lintr

    env:
      # pak resolves Remotes (rootcoder007/rmoriedata, synth-inference/synthdid)
      # against the GitHub API; anonymous lookups can 404 or get rate-
      # limited, surfacing as "Can't find GitHub repo". Pass the runner's
      # GITHUB_TOKEN so pak can authenticate and dependably resolve.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: r-package/morie

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Pre-install rmoriebricklayer (transitive via rmoriedata; r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r-package/morie
          cache-version: 2
          extra-packages: any::lintr

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - name: Run lintr
        run: |
          Rscript -e 'lintr::lint_package()'

  # goodpractice: only on workflow_dispatch. Re-runs R CMD check
  # internally; ~25 min per run; duplicates the matrix r-cmd-check job.
  # Manually fire from the Actions tab before rOpenSci submission.
  goodpractice:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: goodpractice (manual only)

    env:
      _R_CHECK_FORCE_SUGGESTS_: false

    defaults:
      run:
        working-directory: r-package/morie

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Pre-install rmoriebricklayer (transitive via rmoriedata; r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r-package/morie
          cache-version: 2
          extra-packages: any::goodpractice any::rcmdcheck any::covr any::cyclocomp any::lintr

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - name: Run goodpractice
        run: |
          Rscript -e 'g <- goodpractice::gp("."); print(g)'

  # pkgcheck: only on workflow_dispatch. Re-runs covr + cyclocomp +
  # lintr + rcmdcheck internally; ~1 hr per run. Manually fire from
  # the Actions tab before rOpenSci submission.
  pkgcheck:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: rOpenSci pkgcheck (manual only)
    # Advisory pre-submission audit; non-gating because srr's
    # update_msg_paths() crashes on any srr message without a
    # "file [...]" suffix (gsub(character(0), ...) -> "invalid
    # 'pattern' argument") -- present in both CRAN srr 1.0.0 and dev.
    # Remove once the upstream fix lands.
    continue-on-error: true

    defaults:
      run:
        working-directory: r-package/morie

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      # pkgcheck builds the PDF manual; needs LaTeX.
      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - name: Install inconsolata + helpers for PDF manual build
        run: |
          tlmgr update --self
          tlmgr install inconsolata helvetic times courier ec parskip url upquote

      - name: Install system deps for pkgstats (universal-ctags)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y universal-ctags

      - name: Pre-install rmoriebricklayer (transitive via rmoriedata; r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r-package/morie
          cache-version: 2
          extra-packages: |
            any::rcmdcheck
            any::goodpractice
            any::cyclocomp
            any::pkgstats

      # pkgcheck is not on CRAN; install from the rOpenSci r-universe.
      # Then force CRAN pkgstats back on top: the r-universe dev pkgstats
      # (0.2.3.005) crashes on empty-pattern gsub during pkgcheck runs.
      - name: Install pkgcheck (r-universe) + pin CRAN pkgstats
        run: |
          install.packages("pkgcheck", repos = c("https://ropensci-review-tools.r-universe.dev", "https://cloud.r-project.org"))
          install.packages("pkgstats", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - name: Run pkgcheck
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # srr's update_msg_paths() crashes (gsub(character(0), ...) ->
          # "invalid 'pattern' argument") on any srr message lacking a
          # "file [...]" suffix -- present in BOTH CRAN srr 1.0.0 and dev,
          # so pinning does not help. Catch that upstream crash so this
          # advisory audit reports a note instead of a red job; the real
          # gate is R CMD check --as-cran, which runs green in this DAG.
          Rscript -e 'ok <- tryCatch({ cks <- pkgcheck::pkgcheck("."); md <- pkgcheck::checks_to_markdown(cks); writeLines(md, "pkgcheck.md"); cat(md); TRUE }, error = function(e) { m <- conditionMessage(e); message("pkgcheck/srr upstream crash (non-gating): ", m); writeLines(paste0("pkgcheck did not complete due to an upstream srr/pkgcheck crash (update_msg_paths): ", m), "pkgcheck.md"); FALSE }); quit(save = "no", status = 0L)'

      - name: Upload pkgcheck markdown
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkgcheck-markdown
          path: r-package/morie/pkgcheck.md
