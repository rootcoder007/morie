name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


# Triggers only on push to main (admin-merge already short-circuits PR review).
# Path-restricted so docs-only / paper-only / sibling-workflow-only commits
# don't fire a 5-10 min Python+R test cycle.

# Triggered only via the build.yml orchestrator (workflow_call).
# Kept workflow_dispatch so this can still be run manually for
# debugging.
on:
  workflow_call:
  workflow_dispatch:

# Least-privilege: every job here only checks out the repo and runs
# the test suites -- no artifact publishing, no releases, no comments.
permissions:
  contents: read

jobs:
  test-python:
    name: Py ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs widest (oldest + latest Py for backward + forward
        # compat).  macOS + Windows run on latest stable Py only — they
        # catch platform-specific bugs (path separators, line endings,
        # BLAS / numpy wheel availability) without exploding compute.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system build deps (Linux only, cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: gfortran libopenblas-dev pkg-config
          version: 1.0

      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          # --only-binary=numpy,plotly: never resolve their SDISTS. numpy's
          # sdist carries a vendored-meson/"test cases" tree and plotly's
          # carries labextension bundles; both are wheel-absent, and both
          # trip static scanners with false positives. Wheels exist for all
          # CI targets (numpy: manylinux; plotly: py3-none-any).
          # No doubleml extra: DML is native here, and the optional wrapper
          # path is covered by pytest.importorskip.
          pip install --prefer-binary --only-binary=numpy,plotly -e ".[test,interactive]"

      - name: Test
        run: pytest -q --tb=short

      # User-facing smoke — the exact commands documented in README +
      # TUTORIAL.md.  If a refactor breaks the copy-paste user path,
      # the CLI invocations fail before any pytest does.
      - name: Smoke (fresh-user CLI path)
        run: |
          python -c "import morie; print('morie', morie.__version__)"
          morie list-modules
          morie cheatsheet
          morie explain power_summary.csv
          morie pull tps-layers
          morie run-module power-design --output-dir morie-ci-smoke/
          python -c "import os, sys; sys.exit(0 if os.path.exists('morie-ci-smoke/power_summary.csv') else 1)"
        shell: bash

  # Debian portability leg. ubuntu-latest does NOT prove Debian (different
  # glibc/toolchain/BLAS snapshots), and morie ships .deb artifacts via
  # release-debrpm.yml — so the test suite must actually pass on Debian.
  # python:3.13-bookworm is the official Debian 12 image.
  test-debian:
    name: Py 3.13 / debian-bookworm
    runs-on: ubuntu-latest
    container: python:3.13-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Install system build deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends gfortran libopenblas-dev pkg-config

      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary --only-binary=numpy,plotly -e ".[test,interactive]"

      - name: Test
        run: pytest -q --tb=short

      - name: Smoke (fresh-user CLI path)
        run: |
          python -c "import morie; print('morie', morie.__version__)"
          morie list-modules
          morie run-module power-design --output-dir morie-ci-smoke/
          python -c "import os, sys; sys.exit(0 if os.path.exists('morie-ci-smoke/power_summary.csv') else 1)"
        shell: bash

  # Fedora / RHEL-family leg — dnf, different glibc/BLAS stream from the
  # Debian-family jobs; morie also ships .rpm artifacts via
  # release-debrpm.yml, so the suite must pass on Fedora.
  test-fedora:
    name: Py 3.13 / fedora-42
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: System Python + build deps
        run: dnf install -y --setopt=install_weak_deps=False python3.13 python3.13-devel python3-pip gcc-c++ gcc-gfortran openblas-devel pkgconf-pkg-config git && dnf clean all

      - name: Install
        run: |
          python3.13 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary --only-binary=numpy,plotly -e ".[test,interactive]"

      - name: Test
        run: . /tmp/venv/bin/activate && pytest -q --tb=short

      - name: Smoke (fresh-user CLI path)
        run: |
          . /tmp/venv/bin/activate
          python -c "import morie; print('morie', morie.__version__)"
          morie list-modules
          morie run-module power-design --output-dir morie-ci-smoke/
          python -c "import os, sys; sys.exit(0 if os.path.exists('morie-ci-smoke/power_summary.csv') else 1)"
        shell: bash

  # Supply-chain integrity: install the runtime dependency tree from a
  # sha256-pinned lockfile with --require-hashes. This fails the build if
  # any resolved artifact's hash deviates from what was audited -- proof
  # against upstream repo hijack or a silent source swap. Deliberately a
  # single representative env (Linux / py3.12), NOT the wheel-build matrix,
  # so a lock refresh can never make cross-platform wheel builds brittle.
  # Refresh with: uv pip compile requirements.in --generate-hashes \
  #   --python-version 3.12 --python-platform x86_64-unknown-linux-gnu \
  #   -o requirements-lock.txt
  supply-chain-lock:
    name: Supply-chain lock (hash-verified deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Hash-verified install of the audited dependency tree
        run: |
          python -m pip install --upgrade pip
          # --only-binary=numpy,plotly keeps their vendored-sdist trees off
          # disk (see the Install step); the lock pins wheel hashes for both.
          python -m pip install --require-hashes --no-deps --only-binary=numpy,plotly -r requirements-lock.txt
          python -c "import numpy, scipy, pandas, sklearn, statsmodels, httpx, bs4; print('hash-verified deps import OK')"

  # test-papers-latex removed 2026-05-26: the five JSS-format papers
  # (papers/hawkes-paper, papers/morie-empirical-paper,
  # papers/morie-py-paper, papers/morie-r-paper,
  # papers/mrm-formulations-paper) were git rm'd in commit fd415e9e5
  # alongside the Zenodo-DOI cleanup, and the entire papers/ tree is
  # now gitignored as a tripwire. The job is permanently dead code
  # since it loops over directories that no longer exist; restore it
  # only if the publication strategy is re-decided and the papers
  # come back to the repo.

  test-r:
    name: R tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      # rmoriebricklayer source-builds against libcurl (rmbl_fetch.cpp) when its
      # r-universe binary isn't available; install curl/curl.h first.
      - name: System libs for rmoriebricklayer source build
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev

      # setup-r-dependencies@v2 installs DESCRIPTION's Imports/Suggests
      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      # AND any extra-packages list, into the right user library so
      # later library() / Rscript calls find them.
      - name: Pre-install rmoriebricklayer (transitive via rmoriedata; r-universe)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r-package/morie
          extra-packages: any::testthat any::survey any::DBI any::RSQLite any::jsonlite
          # Bust the stale cache that held an old rmoriebricklayer 0.2.0 lacking
          # the rmbl_* C callables (the version was not bumped when the API
          # changed), which made morie_mean_cpp/var/normal_pdf fail.
          cache-version: 2
          needs: check

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - name: Install morie
        run: R CMD INSTALL r-package/morie

      - name: Test
        run: Rscript -e "library(morie); testthat::test_dir('r-package/morie/tests/testthat')"
