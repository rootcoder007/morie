[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "morie"
version = "1.4.3"
description = "Multi-domain scientific computing toolkit (Python + R) for observational inference and intervention analysis. Provides causal estimators (ATE, ATT, AIPW, DML, G-computation), survey sampling, propensity-score and doubly-robust methods, sensitivity analysis, spatial statistics, Hawkes point processes, and psychometrics, with a unified RichResult output."
authors = [
  { name="Vansh Singh Ruhela", email="vsruhela@proton.me" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "MRM",
    "MRM modules",
    "causal inference",
    "observational inference",
    "criminology",
    "Mandela Rules",
    "OTIS",
    "Special Investigations Unit",
    "Structured Intervention Unit",
    "Toronto Police Service",
    "Crime Severity Index",
    "Hawkes process",
    "spatial statistics",
    "signal processing",
    "psychometrics",
    "double machine learning",
    "MORIE",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: R",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Security :: Cryptography",
    "Topic :: Sociology",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# The CI matrix installs ".[test,interactive]"; without these tables pip
# silently installs no extra at all, which is why pytest was missing.
test = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",  # -n auto in addopts: the suite fits real models, one core took 9 min
  "numpy>=1.26",
]
interactive = [
  "textual>=0.60",
]
# Restored after the 1.2.0 merge: the branch's leaner extras table replaced
# main's, which silently dropped `docs`. .github/workflows/pages.yml installs
# ".[docs]", so the Pages build failed with "sphinx-build: command not found"
# -- pip treats an undefined extra as nothing to install rather than an error.
docs = [
  "sphinx>=7.0",
  "sphinx-sitemap",
  "sphinxext-opengraph",
  "myst-parser",
  "sphinxcontrib-mermaid",
]

[project.urls]
Homepage      = "https://rootcoder007.github.io/morie/"
Documentation = "https://rootcoder007.github.io/morie/"
"Source code" = "https://github.com/rootcoder007/morie"
"Issue tracker" = "https://github.com/rootcoder007/morie/issues"
Changelog     = "https://github.com/rootcoder007/morie/releases"
"Download"    = "https://pypi.org/project/morie/#files"
"R package"   = "https://rootcoder007.r-universe.dev/rmorie"
"Container (GHCR)" = "https://github.com/rootcoder007/morie/pkgs/container/morie"


[project.scripts]
morie = "morie.runner:main"

[tool.scikit-build]
# scikit-build-core drives the CMake build of libmorie -> morie._core.
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# The pure-Python package. scikit-build-core copies the whole tree, so
# data files inside it (data/*, fn/_lazy_map.json, ...)
# ship in the wheel without a separate package-data declaration.
wheel.packages = ["src/morie"]
# Collapse morie.fn's ~73k loose files (36k per-callable .py + 36k describe_*.md)
# into two archives generated by CMake (scripts/bundle_fn.py) and installed into
# morie/fn/: _fnsrc.zip (imported via zipimport on fn.__path__) and
# describe_docs.json.xz (read by describe()). Drop the loose files from the wheel
# but keep the infra .py loose. wheel.exclude uses gitignore semantics (pathspec
# GitIgnoreSpec), so the "!" lines re-include the infra files that must stay loose.
wheel.exclude = [
  "morie/fn/describe_*.md",
  "morie/fn/*.py",
  "!morie/fn/_*.py",
  "morie/tests/",
  "morie/*.c",
  "morie/*.h",
  "morie/Makefile",
  "morie/Modelfile*",
  "!morie/fn/__init__.py",
  "!morie/fn/describe.py",
  # The interactive/agent layer runs user/LLM-supplied code (exec + shell -c)
  # and is NOT part of the library API -- every entry point imports it lazily
  # and is guarded. Static scanners (Socket gptMalware / "Uses eval") flag it
  # as an arbitrary-code-execution surface, so it is kept in the source tree
  # but excluded from the published wheel + sdist. `morie repl`/`morie agent`/
  # `morie tui` degrade gracefully when it is absent.
  "morie/polyglot.py",
  "morie/agent.py",
  "morie/tui.py",
  "morie/_exec_guard.py",
  "morie/repl_init.py",
]
# The sdist is a build input, not a repository snapshot: the package, the C++ core,
# the CMake file and the one script CMake runs. Tests, docs, CI, the audit trail,
# the legacy bash launcher and the R package live on GitHub. (Registry scanners
# score everything inside the tarball; shipping the whole tree made the package
# look like it executed shell, eval and network code it never ships.)
sdist.exclude = [
  "*",
  "!/pyproject.toml",
  "!/CMakeLists.txt",
  "!/README.md",
  "!/LICENSE",
  "!/CITATION.cff",
  "!/VERSION",
  "!/WHATS_NEW.md",
  "!/libmorie/",
  "!/libmorie/**",
  "!/scripts/",
  "!/scripts/bundle_fn.py",
  "!/src/",
  "!/src/morie/",
  "!/src/morie/**",
  "/build/",
  "/build/**",
  "/r-package/",
  "/r-package/**",
  # the interactive layer runs user/LLM-supplied code and stays out of every artifact
  "src/morie/polyglot.py",
  "src/morie/agent.py",
  "src/morie/tui.py",
  "src/morie/_exec_guard.py",
  "src/morie/repl_init.py",
  # the placeholder test package ships in neither artifact; listed after the "!/src/morie/**"
  # re-include because the last matching pattern wins
  "/src/morie/tests/",
  "/src/morie/tests/**",
]
# anchored: an unanchored "libmorie/" also re-included build/*/libmorie/*.o and the R package's CMake files
sdist.include = ["/libmorie/", "/CMakeLists.txt", "/scripts/bundle_fn.py", "/LICENSE", "/CITATION.cff"]

[tool.cibuildwheel]
# Build CPython wheels for the supported range; skip musl, 32-bit, PyPy.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *_i686 *-win32"
build-frontend = "build"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
# Python sources only: ruff 0.16 would also reformat the python blocks inside the docs Markdown
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
]
ignore = [
    "E501",   # line too long (we use 120 but some docstrings exceed)
    "N802",   # function name should be lowercase (we have R-style names like dnorm, pnorm)
    "N803",   # argument name should be lowercase (stats conventions: X, Y, N)
    "N806",   # variable in function should be lowercase (matrix names: A, B, Q, R, X)
    "B905",   # zip without strict (Python 3.10 compat)
    "UP007",  # use X | Y for union (Python 3.10 compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "B", "E402"]  # relaxed naming; E402: pytest.importorskip() must run before the guarded import
"src/morie/fn/**" = ["N"]  # short names are intentional

[tool.ruff.lint.isort]
known-first-party = ["morie"]

[tool.pytest.ini_options]
# tests/fn/ holds 36k+ auto-generated tests (~30 CPU-hours total: each
# fits real models on random arrays), so the default run skips them.
# They are NOT dead weight: the nightly fn-sampled workflow runs a
# date-seeded 500-file rotating sample, covering the full set roughly
# every ten weeks. The hand-curated tests in tests/ (top-level) cover
# the public API.
#
# Top-level skips (each documented):
#   - tests/fn: 36k per-callable files; .github/workflows/fn-sampled.yml
#     runs a nightly rotating sample (locally: scripts/audit/run_fn_subset.sh).
#   - test_siu_federal_aggregate.py: needs the OTIS CSV bundle (28 files)
#     not shipped with the package; runs locally with data/datasets/OTIS/
#     populated (55 pass there).
testpaths = ["tests"]
addopts = """\
-q \
-n auto \
--ignore=tests/fn \
--ignore=tests/test_siu_federal_aggregate.py\
"""
